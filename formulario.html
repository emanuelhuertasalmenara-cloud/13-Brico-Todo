<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
 <style>
    label{ font-family: Arial, Helvetica, sans-serif;
        }
        
        body{
            background-color: antiquewhite;
        }
 </style>
        
</head>
<body>
    <h1>Formulario de información</h1>

    <form action="formulario.php" method="post">
 <fieldset>
        <legend>Sus datos</legend>
 <p>
 <label for="nom-ape">Nombre y Apellidos</label>
 <input remaxlength="50" id="nom-ape" type="text" name="nom-ape" required autofocus>
  </p>
  <p>
    <label for="contrase">Contraseña</label>
    <input value="anonimo" type="password" id="contrase" name="contrase">
  </p>
    
</form>

<p>
    <input type="radio" name="nivel" id="profesional"><label for="profesional">Profesional</label>
</p>
<p>
    <input type="radio" name="nivel" id="avanzado"><label for="avanzado">Avanzado</label>
</p>
<p>
    <input type="radio" name="nivel" id="principiante"><label for="principiante">Principiante</label>
</p>
    </fieldset>
    <label for="nacionalidad">Nacionalidad:</label>
    <select name="nacionalidad" id="nacionalidad">
        <option value="francia">Francia</option>
        <option value="españa">España</option>
        <option value="portugal">Portugal</option>
    </select>
    <p>
        <label for="descrip">Descripción</label>
        <textarea name="descrip" id="descrip" rows="5"></textarea>
    </p>
    <p>
        <input checked type="checkbox" name="recibir" id="recibir">
        <label for="recibir">Deseo recibir información sobre novedades y ofertas</label>
    </p>
    <p>
        <input  type="checkbox" name="declaro" id="declaro">
        <label for="declaro">Declaro haber leido y aceptar las condiciones</label>
    </p>
    <p>
        <label for="foto">Subir Foto</label>
        <input type="file" name="foto" id="foto">
    </p>
    <p>
        <label for="hora">Hora de llegada</label>
        <input type="time" name="hora" id="hora">
    </p>
    <p>
        <label for="email">Email</label>
        <input type="email" name="email" id="emial">
    </p>
    <p>
        <label for="edad">Edad</label>
        <input type="number" min="0" max="25" name="num" id="num">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Reiniciar cuestionario">
    </p>
    <a href="index.html">Volver a principal</a>
</body>
</html>
